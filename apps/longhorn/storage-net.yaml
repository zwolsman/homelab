apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: longhorn-storage-net
  namespace: longhorn-system
spec:
  config: '{
      "cniVersion": "1.0.0",
      "type": "macvlan",
      "master": "storage0",
      "mode": "bridge",
      "ipam": {
        "type": "host-local",
        "subnet": "192.168.10.0/24",
        "rangeStart": "192.168.10.10",
        "rangeEnd": "192.168.10.250",
        "routes": [
          { "dst": "192.168.10.0/24" }
        ]
      }
    }'