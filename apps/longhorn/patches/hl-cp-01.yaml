apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: hl-cp-01
  namespace: longhorn-system
spec:
  tags:
    - ssd
  disks:
    default-disk-080400000000:
      allowScheduling: false
      storageReserved: 0
      tags:
        - ssd
    nvme1:
      allowScheduling: true
      storageReserved: 0
      diskType: filesystem
      path: /var/mnt/nvme1
      tags:
        - ssd