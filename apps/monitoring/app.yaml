apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    glance/icon: di:grafana
spec:
  project: default
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.21.0
    helm:
      valuesObject:
        grafana:
          ingress:
            enabled: true
            ingressClassName: tailscale
            tls:
              - hosts:
                  - "grafana"
          persistence:
            enabled: true
            type: sts
            storageClassName: "longhorn-hdd"
            accessModes:
              - ReadWriteOnce
            size: 5Gi
        nodeExporter:
          enabled: true
        prometheus-node-exporter:
          hostRootFsMount:
            enabled: false
          tolerations:
            - operator: Exists
              effect: NoSchedule
        prometheus:
          ingress:
            enabled: true
            ingressClassName: tailscale
            tls:
              - hosts:
                  - "prometheus"
          prometheusSpec:
            retention: 30d
            retentionSize: 50GiB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: "longhorn-hdd"
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 75Gi
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
