---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: api-credentials
  namespace: audiosteamer
spec:
  encryptedData:
    AUDD_APIKEY: 
    SPRING_DATASOURCE_PASSWORD: 
    SPRING_DATASOURCE_URL: 
    SPRING_DATASOURCE_USERNAME: 
  template:
    metadata:
      name: api-credentials
      namespace: audiosteamer
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-secret
  namespace: audiosteamer
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-secret
      namespace: audiosteamer
    type: kubernetes.io/dockerconfigjson
